name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'grayskill/grayskillfs' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Check release metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          version=$(jq -r '.packages[0].version' <<< "$metadata")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must match Cargo.toml version (v$version)."
            exit 1
          fi
          if ! jq -e '.packages[0] | (.license != null or .license_file != null)' <<< "$metadata" >/dev/null; then
            echo "::error::Set the package license or license-file before publishing."
            exit 1
          fi
      - name: Verify package
        run: cargo publish --locked --dry-run
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
